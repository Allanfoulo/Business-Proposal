<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Proposal Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <div class="max-w-5xl mx-auto py-10 px-4">
      <h1 class="text-3xl font-semibold text-gray-900 mb-6">Business Proposal Generator</h1>

      <form action="/generate" method="POST" class="space-y-8 bg-white p-6 rounded-lg shadow">
        <section>
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Company Details</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-gray-700">Company Name</label>
              <input name="company_name" class="mt-1 w-full border rounded px-3 py-2" placeholder="Acme Corp" />
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Industry</label>
              <input name="industry" class="mt-1 w-full border rounded px-3 py-2" placeholder="Software" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Mission</label>
              <textarea name="mission" class="mt-1 w-full border rounded px-3 py-2" rows="2" placeholder="Our mission is..."></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Vision</label>
              <textarea name="vision" class="mt-1 w-full border rounded px-3 py-2" rows="2" placeholder="Our vision is..."></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Products</label>
              <textarea name="products" class="mt-1 w-full border rounded px-3 py-2" rows="3" placeholder="List key products/services..."></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Market</label>
              <textarea name="market" class="mt-1 w-full border rounded px-3 py-2" rows="3" placeholder="Target segments, trends..."></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Financials</label>
              <textarea name="financials" class="mt-1 w-full border rounded px-3 py-2" rows="3" placeholder="Pricing, revenue model, forecast notes..."></textarea>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Team</label>
              <textarea name="team" class="mt-1 w-full border rounded px-3 py-2" rows="2" placeholder="Key roles, advisors..."></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Goals</label>
              <textarea name="goals" class="mt-1 w-full border rounded px-3 py-2" rows="2" placeholder="Milestones, OKRs..."></textarea>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Strategies</label>
              <textarea name="strategies" class="mt-1 w-full border rounded px-3 py-2" rows="2" placeholder="GTM, partnerships..."></textarea>
            </div>
          </div>
        </section>

        <section>
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Sections & Priorities</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for key in sections %}
            <div class="flex items-center justify-between border rounded px-3 py-2">
              <div class="text-sm font-medium text-gray-700">{{ headers[key] }}</div>
              <select name="section_choice_{{ key }}" class="border rounded px-2 py-1 text-sm">
                <option value="normal" selected>Include (normal)</option>
                <option value="priority">Include (priority)</option>
                <option value="skip">Skip</option>
              </select>
            </div>
            {% endfor %}
          </div>
        </section>

        <section>
          <h2 class="text-xl font-semibold text-gray-800 mb-4">Generation Settings</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="flex items-center gap-2">
              <input type="checkbox" id="parallel_mode" name="parallel_mode" class="h-4 w-4" checked />
              <label for="parallel_mode" class="text-sm text-gray-700">Parallel mode</label>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">Max workers</label>
              <input type="number" name="max_workers" value="5" min="1" max="12" class="mt-1 w-full border rounded px-3 py-2" />
            </div>
            <div class="flex items-center gap-2">
              <input type="checkbox" id="live_stream" name="live_stream" class="h-4 w-4" />
              <label for="live_stream" class="text-sm text-gray-700">Live stream outputs</label>
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700">LLM Provider</label>
              <select name="provider" class="mt-1 w-full border rounded px-3 py-2">
                <option value="ollama" selected>Ollama (local)</option>
                <option value="groq">Groq</option>
                <option value="dummy">Dummy</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium text-gray-700">Model</label>
              <input name="model" class="mt-1 w-full border rounded px-3 py-2" placeholder="e.g., llama3.1 or mixtral-8x7b" />
            </div>
          </div>
        </section>

        <div class="flex justify-end">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Generate Proposal</button>
        </div>
      </form>
    </div>
  </body>
</html>
